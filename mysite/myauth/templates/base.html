<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MySite{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        nav {
            background: #333;
            padding: 15px;
            color: white;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 5px;
        }
        .user-info {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .btn {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn-danger {
            background: #dc3545;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .btn-success {
            background: #28a745;
        }
        .btn-success:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'myauth:index' %}">🏠 Главная</a>

        <a href="{% url 'myauth:cookie_get' %}">🍪 Получить cookie</a>
        <a href="{% url 'myauth:cookie_set' %}">🍪 Установить cookie</a>
        <a href="{% url 'myauth:session_get' %}">📦 Получить session</a>
        <a href="{% url 'myauth:session_set' %}">📦 Установить session</a>

        <div class="user-info">
            {% if user.is_authenticated %}
                <span>👤 {{ user.username }}</span>
                <form action="{% url 'myauth:logout' %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">🚪 Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'myauth:login' %}" class="btn btn-success">🔑 Войти</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}
            <h1>Добро пожаловать!</h1>
            <p>Используйте навигацию выше.</p>
        {% endblock %}
    </div>
</body>
</html>
