{% extends 'base.html' %}

{% block title %}
  {% if object %}Update{% else %}Create{% endif %} Order
{% endblock %}

{% block content %}
  <h1>{% if object %}Update{% else %}Create{% endif %} Order</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if object %}Update{% else %}Create{% endif %}</button>
  </form>

  <div>
    <a href="{% url 'shopapp:orders_list' %}">← Back to orders list</a>
  </div>

  {% if object %}
    <div>
      <a href="{% url 'shopapp:order_detail' pk=object.pk %}">Cancel</a>
    </div>
  {% endif %}
{% endblock %}
