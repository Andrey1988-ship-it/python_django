{% extends 'base.html' %}

{% block title %}
   Update product
{% endblock %}

{% block content %}
  <h1>Update product</h1>
  <div>
      <form method="post">
          {% csrf_token %}
          {{ form.as_p}}
          <button type="submit">Update</button>
      </form>
  </div>
<div>
    <a href="{% url 'shopapp:product_detail' pk=object.pk %}">  <!-- 👈 ИСПРАВЛЕНО -->
        Back to product #{{ object.pk }}
    </a>
</div>
{% endblock %}
