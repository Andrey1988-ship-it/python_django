<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин брелоков{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
        }
        
        header {
            background-color: #333;
            color: #fff;
            padding: 1rem 0;
        }
        
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 10px 15px;
            display: inline-block;
        }
        
        nav a:hover {
            background-color: #555;
            border-radius: 5px;
        }
        
        main {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            min-height: 500px;
        }
        
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1rem 0;
            margin-top: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        h2 {
            color: #555;
            margin: 20px 0 10px 0;
        }
        
        .page-list {
            list-style: none;
            padding: 0;
        }
        
        .page-list li {
            margin: 15px 0;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 5px;
            transition: transform 0.3s;
        }
        
        .page-list li:hover {
            transform: translateX(10px);
            background-color: #f0f0f0;
        }
        
        .page-list a {
            font-size: 1.2rem;
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }
        
        .page-list a:hover {
            color: #e44d26;
        }
        
        .description {
            color: #666;
            margin-top: 5px;
        }
        
        .products-grid, .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .product-card, .order-card {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            transition: transform 0.3s;
            background-color: #fff;
        }
        
        .product-card:hover, .order-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .product-title, .order-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        .product-price {
            color: #e44d26;
            font-size: 1.3rem;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .product-discount {
            color: green;
            font-size: 0.9rem;
        }
        
        .order-status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        
        .status-new { background-color: #3498db; color: white; }
        .status-processing { background-color: #f39c12; color: white; }
        .status-paid { background-color: #27ae60; color: white; }
        .status-completed { background-color: #2ecc71; color: white; }
        .status-cancelled { background-color: #e74c3c; color: white; }
        
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8rem;
            margin-left: 10px;
        }
        
        .badge-active { background-color: #27ae60; color: white; }
        .badge-inactive { background-color: #95a5a6; color: white; }
        
        .total-count {
            color: #666;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }
        
        .product-list {
            margin-top: 20px;
        }
        
        .product-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'shopapp:shop_index' %}">Главная</a>
            <a href="{% url 'shopapp:products_list' %}">Товары</a>
            <a href="{% url 'shopapp:orders_list' %}">Заказы</a>
            <a href="/admin/">Админка</a>
        </nav>
    </header>
    
    <main>
        {% block content %}
        {% endblock %}
    </main>
    
    <footer>
        <p>&copy; 2026 Магазин брелоков. Все права защищены.</p>
        <p>{% now "Y-m-d H:i" %}</p>
    </footer>
</body>
</html>
