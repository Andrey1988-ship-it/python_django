{% extends 'shopapp/base.html' %}

{% block title %}Обновление профиля{% endblock %}

{% block body %}
<h1>Обновление профиля</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>
<a href="{% url 'myauth:about_me' %}">Назад в мой профиль</a>
<div>
    {% if form.instance.avatar %}
        <img src="{{ form.instance.avatar.url }}" alt="Текущий аватар" style="max-width: 200px;">
    {% else %}
        <p>Аватар не установлен</p>
    {% endif %}
</div>
{% endblock %}
