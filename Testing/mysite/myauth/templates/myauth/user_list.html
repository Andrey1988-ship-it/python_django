{% extends 'shopapp/base.html' %}

{% block title %}Пользователи{% endblock %}

{% block body %}
<h1>Все пользователи</h1>
<ul>
    {% for user in users %}
        <li>
            <a href="{% url 'myauth:user_detail' username=user.username %}">
                {{ user.username }}
            </a>
        </li>
    {% empty %}
        <li>Нет пользователей</li>
    {% endfor %}
</ul>
<a href="{% url 'myauth:about_me' %}">Назад в профиль</a>
{% endblock %}
