{% extends 'shopapp/base.html' %}

{% block title %}
  Confirm delete {{ object.name }}
{% endblock %}

{% block body %}
  <h1>Are you sure you want to delete "{{ object.name }}"?</h1>

  <form method="post">
    {% csrf_token %}
    <button type="submit">🗑️ Yes, delete</button>
  </form>

  <div>
    <a href="{% url 'shopapp:product_detail' pk=object.pk %}">← Back to product</a>
  </div>
{% endblock %}
