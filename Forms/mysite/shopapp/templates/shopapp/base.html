<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>
    {% block title %}
      Магазин
    {% endblock %}
  </title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    nav { background: #333; padding: 15px; color: white; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    nav a { color: white; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    nav .user-info { margin-left: auto; }
    .container { max-width: 1200px; margin: 20px auto; padding: 20px; background: white; border-radius: 5px; }
    .btn, button { display: inline-block; padding: 8px 16px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; }
    button:hover, .btn:hover { opacity: 0.8; }
    .btn-success { background: #28a745; }
    .btn-warning { background: #ffc107; color: black; }
    .btn-danger { background: #dc3545; }
    ul { list-style: none; padding: 0; }
    ul li { padding: 10px; border-bottom: 1px solid #eee; }
    ul li:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'shopapp:shop_index' %}">🏠 Главная</a>
    <a href="{% url 'shopapp:products_list' %}">📦 Товары</a>
    <a href="{% url 'shopapp:orders_list' %}">📋 Заказы</a>
    <a href="{% url 'shopapp:groups_list' %}">👥 Группы</a>
    <a href="/admin/">🔧 Админка</a>

    <span class="user-info">
      {% if user.is_authenticated %}
        👋 {{ user.username }}
        <a href="{% url 'myauth:logout' %}" class="btn btn-danger" style="padding: 4px 12px; font-size: 14px;">Выйти</a>
      {% else %}
        <a href="{% url 'myauth:login' %}" class="btn" style="padding: 4px 12px; font-size: 14px;">🔑 Войти</a>
      {% endif %}
    </span>
  </nav>

  <div class="container">
    {% block body %}
      Base body
    {% endblock %}
  </div>
</body>
</html>
