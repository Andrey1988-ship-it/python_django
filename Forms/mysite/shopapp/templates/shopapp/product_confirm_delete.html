{% extends 'shopapp/base.html' %}

{% block title %}
  Confirm archive {{ object.name }}
{% endblock %}

{% block body %}
  <h1>Are you sure you want to archive "{{ object.name }}"?</h1>
  <p>После архивации товар не будет отображаться в списке.</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">🗄️ Yes, archive</button>
  </form>

  <div>
    <a href="{% url 'shopapp:product_detail' pk=object.pk %}">← Back to product</a>
  </div>
{% endblock %}
